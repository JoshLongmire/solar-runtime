; Waveshare ESP32-S3-LCD-2 (16MB flash, 8MB OPI PSRAM) — Solar Manager HUD
[platformio]
src_dir = Arduino/examples/13_bme280_env_clock
default_envs = esp32s3_lcd2

[env:esp32s3_lcd2]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_encoding = utf-8
upload_speed = 921600
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DBOARD_HAS_PSRAM
lib_deps =
  moononournation/GFX Library for Arduino@1.6.5
  file://Arduino/libraries/OneButton
  file://Arduino/libraries/FastIMU
  file://Arduino/libraries/ESP32_S3_LCD2_Board
  bitbank2/JPEGDEC@^1.8.4
  adafruit/Adafruit BMP280 Library
  adafruit/Adafruit BME280 Library
  claws/BH1750@^1.3.0
  adafruit/Adafruit CCS811 Library@^1.1.3
  adafruit/Adafruit Unified Sensor
  adafruit/Adafruit BusIO

; After the USB flash that includes ArduinoOTA: wake the board (Wi-Fi on), then:
;   pio run -e esp32s3_lcd2_ota -t upload
[env:esp32s3_lcd2_ota]
extends = env:esp32s3_lcd2
upload_protocol = espota
upload_port = solarmanager.local
upload_flags =
  --auth=solarmanager
